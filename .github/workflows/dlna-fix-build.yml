name: Build Windows (DLNA fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Kazumi_windows_dlnafix.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-windows-dlnafix
          path: Kazumi_windows_dlnafix.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dlna-fix
          name: DLNA cast fix build
          files: Kazumi_windows_dlnafix.zip
